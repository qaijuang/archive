<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg   { fill: #111009; }
    .arr  { stroke: #c9913a; }
    @media (prefers-color-scheme: light) {
      .bg  { fill: #f4efe6; }
      .arr { stroke: #b07d2a; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <g class="arr" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="2.5">
    <line x1="8"  y1="24" x2="22" y2="10"/>
    <line x1="22" y1="10" x2="22" y2="17"/>
    <line x1="22" y1="10" x2="15" y2="10"/>
  </g>
</svg>
