name: Monthly Archive Publish

# Runs at 23:55 UTC on days 28-31 of every month.
# The script itself checks whether today is truly the last day of the month
# and exits early if not, handling months shorter than 31 days correctly.

on:
  schedule:
    - cron: "55 23 28-31 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check if today is the last day of the month
        id: date-check
        run: python scripts/is_last_day.py

      - name: Fetch contributions
        if: steps.date-check.outputs.is_last_day == 'true'
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          python scripts/fetch.py --year "$YEAR" --month "$MONTH"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ github.repository_owner }}
          GH_EXCLUDED_ORGS: ${{ secrets.GH_EXCLUDED_ORGS }}

      - name: Commit new contribution data
        if: steps.date-check.outputs.is_last_day == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions/
          git diff --cached --quiet && echo "[skip] no new data to commit" || \
            git commit -m "chore: archive $(date +%Y-%m) contributions"
          git push

# The deploy workflow will gets triggered by the push to main and will handle the actual deployment to GitHub Pages.
